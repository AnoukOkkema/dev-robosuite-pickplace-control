version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | - %(message)s"
    datefmt: "%H:%M:%S"

  detailed:
    format: "%(asctime)s | %(name)s | %(levelname)-8s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stderr

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/main.log
    encoding: utf8
    mode: w

loggers:
  robosuite_logs:
    level: ERROR
    handlers: [console, file]
    propagate: false

  numba:
    level: WARNING
    handlers: [console, file]
    propagate: false

root:
  level: DEBUG
  handlers: [console, file]
